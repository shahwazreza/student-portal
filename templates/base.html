<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Student Gradebook System</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">Gradebook</a>

            <ul class="navbar-nav ms-auto">

                {% if session.get("user") %}

                {% if session["user"][4] == "admin" %}
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/add_course">Add Course</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/enroll_student">Enroll</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/assign_grade">Assign Grades</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/grades">Gradebook</a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/profile">My Courses</a>
                </li>

                {% endif %}

                <li class="nav-item">
                    <a class="nav-link text-danger" href="/logout">Logout</a>
                </li>

                {% endif %}

            </ul>
        </div>
    </nav>

    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
